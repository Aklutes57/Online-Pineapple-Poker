<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pineapple Poker — Table</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#10131c">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/table.css">
</head>
<body class="table-page">
  <div id="app">
    <header id="top-bar">
      <a class="pineapple-mark" href="/">🍍 <span class="pine">Pineapple</span> Poker</a>
      <span id="game-badge"></span>
      <button id="fair-chip" class="fair-chip hidden" title="Provably-fair shuffle — click for details"></button>
      <a id="account-chip" class="account-chip hidden" href="/me"></a>
      <div class="top-actions">
        <button id="copy-link" class="btn-ghost btn top-btn" title="Copy the invite link">🔗 Invite</button>
        <span class="react-wrap">
          <button id="react-btn" class="btn-ghost btn top-btn" title="React">😀</button>
          <div id="react-picker" class="hidden"></div>
        </span>
        <button id="av-join" class="btn-ghost btn top-btn hidden" title="Turn on your camera & mic">📹 Video</button>
        <span id="av-live" class="av-live hidden">
          <button id="av-cam" class="btn-ghost btn top-btn" title="Turn camera off">📷</button>
          <button id="av-mic" class="btn-ghost btn top-btn" title="Mute mic">🎙️</button>
          <button id="av-leave" class="btn-ghost btn top-btn" title="Leave video &amp; voice">📹✕</button>
        </span>
        <button id="sound-toggle" class="btn-ghost btn top-btn" title="Sound on/off">🔊</button>
        <button id="deck-toggle" class="btn-ghost btn top-btn" title="Four-color deck on/off">🃏</button>
        <button id="push-bell" class="btn-ghost btn top-btn" title="Turn alerts when you're away">🔕</button>
        <button id="host-menu-btn" class="btn-ghost btn top-btn hidden" title="Host controls">⚙️ Host</button>
        <button id="leave-btn" class="btn-ghost btn top-btn hidden" title="Leave your seat">Stand up</button>
        <button id="panel-toggle" class="btn-ghost btn top-btn" title="Chat and logs">💬<span id="unread-badge" class="hidden"></span><span id="seatreq-badge" class="req-badge hidden"></span></button>
      </div>
    </header>

    <main id="table-area">
      <div id="table">
        <div id="table-center">
          <div id="board"></div>
          <div id="pot-line" class="hidden"></div>
          <div id="center-message"></div>
        </div>
        <div id="bets-layer"></div>
        <div id="seats-layer"></div>
        <div id="reactions-layer"></div>
      </div>
      <div id="cooler-banner" class="hidden"></div>
      <div id="rotate-hint" class="hidden">Rotate your phone for the best view <button id="rotate-dismiss">✕</button></div>
    </main>

    <aside id="side-panel" class="collapsed">
      <div id="seat-requests" class="hidden"></div>
      <div class="tabs">
        <button data-tab="chat" class="tab active">Chat</button>
        <button data-tab="log" class="tab">Log</button>
        <button data-tab="ledger" class="tab">Ledger</button>
        <button data-tab="fair" class="tab">Fair</button>
        <button id="panel-close" class="tab tab-close">✕</button>
      </div>
      <div id="tab-chat" class="tab-body">
        <div id="chat-list" class="scroll-list"></div>
        <form id="chat-form">
          <input id="chat-input" maxlength="300" placeholder="Say something…" autocomplete="off">
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </div>
      <div id="tab-log" class="tab-body hidden">
        <div id="log-list" class="scroll-list"></div>
      </div>
      <div id="tab-ledger" class="tab-body hidden">
        <div id="ledger-table" class="scroll-list"></div>
      </div>
      <div id="tab-fair" class="tab-body hidden">
        <div id="fair-panel" class="scroll-list"></div>
      </div>
    </aside>

    <footer id="action-bar"></footer>
  </div>

  <!-- Seat request modal -->
  <div class="modal-backdrop hidden" id="join-modal">
    <div class="modal">
      <h2 id="join-title">Take a seat</h2>
      <div class="field">
        <label for="j-nickname">Nickname</label>
        <input id="j-nickname" maxlength="20" autocomplete="off">
      </div>
      <div class="field">
        <label for="j-buyin">Buy-in <span id="j-buyin-range"></span></label>
        <input id="j-buyin" type="number">
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="j-cancel">Cancel</button>
        <button class="btn btn-primary" id="j-request">Request seat</button>
      </div>
    </div>
  </div>

  <!-- Host settings modal -->
  <div class="modal-backdrop hidden" id="host-modal">
    <div class="modal">
      <h2>Host controls</h2>
      <div class="field">
        <label for="h-variant">Game (changes from the next hand)</label>
        <select id="h-variant"></select>
      </div>
      <div class="row">
        <div class="field">
          <label for="h-sb">Small blind</label>
          <input id="h-sb" type="number" min="1">
        </div>
        <div class="field">
          <label for="h-bb">Big blind</label>
          <input id="h-bb" type="number" min="1">
        </div>
        <div class="field">
          <label for="h-timer">Timer</label>
          <select id="h-timer">
            <option value="15">15s</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
            <option value="0">Off</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="h-timebank">Time bank</label>
          <select id="h-timebank">
            <option value="0">Off</option>
            <option value="15">15s</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
          </select>
        </div>
        <div class="field">
          <label for="h-bomb">Bomb pot</label>
          <select id="h-bomb">
            <option value="0">Off</option>
            <option value="5">Every 5 hands</option>
            <option value="10">Every 10 hands</option>
            <option value="20">Every 20 hands</option>
          </select>
        </div>
        <div class="field">
          <label for="h-72">7-2 bounty payout</label>
          <input id="h-72" type="number" min="1" step="1" disabled>
        </div>
      </div>
      <div class="option-toggles">
        <label class="toggle"><input type="checkbox" id="h-straddle"><span>Straddle</span></label>
        <label class="toggle"><input type="checkbox" id="h-rabbit"><span>Rabbit hunt</span></label>
        <label class="toggle"><input type="checkbox" id="h-rit"><span>Run it twice</span></label>
        <label class="toggle"><input type="checkbox" id="h-72-on"><span>7-2 bounty</span></label>
      </div>
      <p class="hint">All table changes apply from the next hand. "No limit" on the timer makes the table untimed.</p>
      <div class="actions" style="justify-content: flex-start">
        <button class="btn btn-primary" id="h-save">Save settings</button>
        <button class="btn btn-ghost" id="h-pause">Pause</button>
      </div>
      <h2 style="margin-top:22px">Players</h2>
      <div id="h-players"></div>
      <div class="actions" style="justify-content: space-between; margin-top: 26px">
        <button class="btn btn-red" id="h-close-table">Close table</button>
        <button class="btn btn-ghost" id="h-done">Done</button>
      </div>
    </div>
  </div>

  <!-- Closed overlay -->
  <div class="modal-backdrop hidden" id="closed-overlay">
    <div class="modal" style="text-align:center">
      <h2>Table closed</h2>
      <p id="closed-reason" style="color:var(--text-dim); margin-bottom:18px"></p>
      <div id="closed-ledger"></div>
      <a class="btn btn-primary" href="/" style="margin-top:18px; text-decoration:none">Back to home</a>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
