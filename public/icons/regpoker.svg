<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Reg-Poker Online mark: a brass-ringed felt disc carrying an RP monogram. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="76%">
      <stop offset="0%" stop-color="#1a8a63"/>
      <stop offset="55%" stop-color="#127455"/>
      <stop offset="100%" stop-color="#063527"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="38%" stop-color="#e8c65c"/>
      <stop offset="52%" stop-color="#a97d1c"/>
      <stop offset="62%" stop-color="#f6e39b"/>
      <stop offset="100%" stop-color="#b3891f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#2c0a14"/>

  <!-- walnut rail + brass rings -->
  <circle cx="256" cy="256" r="214" fill="#4a2e18"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#a97d1c" stroke-width="9"/>
  <circle cx="256" cy="256" r="178" fill="url(#felt)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#c9a227" stroke-width="11"/>

  <!-- chip notches around the rail -->
  <g fill="#f3dc9a">
    <rect x="242" y="50" width="28" height="34" rx="7"/>
    <rect x="242" y="428" width="28" height="34" rx="7"/>
    <rect x="50" y="242" width="34" height="28" rx="7"/>
    <rect x="428" y="242" width="34" height="28" rx="7"/>
  </g>

  <!-- RP monogram -->
  <text x="256" y="322" text-anchor="middle"
        font-family="'Arial Black','Arial Bold',Helvetica,Arial,sans-serif"
        font-size="196" font-weight="900" letter-spacing="-6"
        fill="url(#brass)" stroke="#1c0709" stroke-width="26"
        stroke-linejoin="round" paint-order="stroke">RP</text>

  <!-- suit pips tucked under the monogram -->
  <g font-family="Georgia,'Times New Roman',serif" font-size="46" text-anchor="middle">
    <text x="204" y="392" fill="#f6edd9">&#9824;</text>
    <text x="308" y="392" fill="#e2596b">&#9829;</text>
  </g>
</svg>
